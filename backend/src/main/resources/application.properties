spring.application.name=rexxo-backend
server.port=8080

# ─── Database (PostgreSQL via env vars) ───────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rexxo}
spring.datasource.username=postgres
spring.datasource.password=Sumit@123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=RexxoPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# Using 'update' during development so Hibernate auto-creates/alters tables.
# Switch to 'validate' in production once schema is stable and managed by Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Set JWT_SECRET env var to a 256-bit (32+ char) base64-encoded secret in production
app.jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTSigningThatMustBeAtLeast256BitsLongForHS256Algorithm}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ─── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}

# ─── Razorpay ─────────────────────────────────────────────────────────────────
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholder_secret}

# ─── Cloudinary ───────────────────────────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:placeholder}
cloudinary.api-key=${CLOUDINARY_API_KEY:placeholder}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:placeholder}

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.rexxo=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# ─── File upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ─── Shiprocket ───────────────────────────────────────────────────────────────
shiprocket.email=${SHIPROCKET_EMAIL:}
shiprocket.password=${SHIPROCKET_PASSWORD:}
shiprocket.base-url=${SHIPROCKET_BASE_URL:https://apiv2.shiprocket.in}
# Pickup pincode for REXXZO warehouse
shiprocket.pickup-pincode=${SHIPROCKET_PICKUP_PINCODE:110001}

# ─── Mail Delivery (JavaMail / SMTP) ──────────────────────────────────────────
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:noreply@rexxzo.com}

# ─── SMS Delivery ─────────────────────────────────────────────────────────────
sms.provider=${SMS_PROVIDER:fast2sms}
sms.api-key=${SMS_API_KEY:}
sms.api-secret=${SMS_API_SECRET:}
sms.sender-id=${SMS_SENDER_ID:REXXZO}

# ─── OTP Policy ───────────────────────────────────────────────────────────────
otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}
otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
otp.dev-mode=${OTP_DEV_MODE:false}

# ─── WhatsApp Notifications ──────────────────────────────────────────────────
whatsapp.provider=${WHATSAPP_PROVIDER:meta}
whatsapp.api-url=${WHATSAPP_API_URL:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}

# ─── Configured Admin Credentials ─────────────────────────────────────────────
app.admin.email=${ADMIN_EMAIL:Therexxzoin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:Rexxzo@123321}
app.admin.name=${ADMIN_NAME:REXXZO Master Administrator}

