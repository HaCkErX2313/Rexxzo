# ─── Production Spring Boot Profile ──────────────────────────────────────────
# Activated when SPRING_PROFILES_ACTIVE=prod (e.g., in Railway or cloud deployment)

# Logging: suppress verbose debug logs in production
logging.level.com.rexxo=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Performance / Hikari
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate: keep ddl-auto configurable; defaults to update or validate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# OTP Dev Mode must always be false in production
otp.dev-mode=false
